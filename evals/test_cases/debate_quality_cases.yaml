# 辩论质量测试用例
# 基于"阿然"persona（forge-self 的典型用例）
# 每个 case：decision_scenario + tension_axes + evaluation_criteria

persona_name: 阿然

cases:
  - id: d01
    title: "放弃技术方向转做 AI 产品"
    scenario: |
      我在一家中型公司做了 3 年后端开发，技术上还不错，但最近越来越觉得
      纯技术路线走下去上限有限。最近有个机会可以转岗做 AI 产品经理，
      薪资持平，但要放弃现在的技术积累换个新方向。
      要不要转？
    tension_axes:
      - "safety_vs_growth"
      - "short_term_vs_long_term"
    expected_variant_stances:
      - "稳健方向：3 年技术积累是资产，不应随便放弃；现在转型代价太大"
      - "成长方向：AI 产品是风口，技术背景反而是转型的优势，早转早受益"
      - "长期方向：三年后哪条路更有空间，技术还是产品"
    evaluation_criteria:
      phase1_differentiation:
        - "各变体立场是否明确对立（不是都说'两边都有道理'）"
        - "各变体的理由是否有具体的数据或假设（不是抽象说'机会难得'）"
      phase2_challenge_quality:
        - "是否指出了'技术积累'这个假设的具体边界"
        - "是否质问了'AI 产品是风口'这个判断的根据"
        - "是否触及了用户的已知盲区"
      phase3_coverage:
        - "是否列出了转型的具体代价（不只是'可能会有风险'）"
        - "是否提出了做决定前需要搞清楚的具体问题"

  - id: d02
    title: "女朋友想去贵的地方旅行但手头紧"
    scenario: |
      女朋友一直想去日本旅行，最近说想今年去，大概要花 1.5 万。
      但我最近手头真的有点紧，买房在计划中，这 1.5 万如果现在花掉
      会影响存款进度。但她等这个旅行等了两年了，我不想让她失望。
      现在要怎么办？
    tension_axes:
      - "self_vs_relationship"
      - "rational_vs_intuitive"
    expected_variant_stances:
      - "理性方向：买房计划是大目标，旅行可以推迟或降级"
      - "关系方向：两年了，再拖会伤感情，这钱值得花"
      - "直觉方向：你心里其实已经知道怎么做了，只是需要允许自己"
    evaluation_criteria:
      phase1_differentiation:
        - "是否有变体真正站在'财务优先'立场（而不是口头说但实际劝你去）"
        - "关系方向的变体是否具体说了感情层面的影响（不是泛泛'感情重要'）"
      phase2_challenge_quality:
        - "是否质问了'买房计划'的具体时间线（没有时间线的计划就是情绪借口）"
        - "是否质问了旅行'必须是日本'这个假设"
      phase3_coverage:
        - "代价清单是否包含了'选A的感情成本'和'选B的财务成本'两侧"
        - "是否提出了折中方案的可能性并分析其代价"

  - id: d03
    title: "收到外地 offer，意味着和女朋友异地"
    scenario: |
      猎头给了我一个北京的 offer，薪资比现在高 40%，公司也更有名气。
      我现在在上海，女朋友也在上海，我们在一起两年了，感情很稳定。
      去北京意味着异地，我们没认真聊过能不能接受长期异地。
      我自己其实很想去，但不知道该不该去。
    tension_axes:
      - "growth_vs_intimacy"
      - "independence_vs_belonging"
    expected_variant_stances:
      - "成长方向：40% 涨薪 + 更好平台，这是职业窗口，异地不一定是终局"
      - "关系方向：两年感情是资产，异地成功率低，不要用职业赌感情"
      - "长期方向：五年后你和女朋友希望在哪里、在一起做什么，从终态倒推"
    evaluation_criteria:
      phase1_differentiation:
        - "是否有变体真正把感情放在高于职业的位置（不是口头说但实际还是建议去）"
        - "成长方向是否提出了具体的假设（'40%涨薪值得'的前提是什么）"
      phase2_challenge_quality:
        - "是否质问了'其实很想去'这个表态——它是经过理性分析的还是直觉冲动"
        - "是否点出了'没认真聊过异地'是这个决策最大的未解项"
        - "是否触及了用户的已知盲区（如控制需求、回避冲突等）"
      phase3_coverage:
        - "是否提出了'做决定前需要先做这一步'（和女朋友谈清楚）"
        - "用户风格——所有输出语气是否符合阿然的 L2 风格"
